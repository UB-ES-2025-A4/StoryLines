<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Búsqueda de Usuarios - US1.10</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      padding-left: 40px;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .results {
      margin-top: 30px;
    }

    .result-item {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.2s;
      border: 2px solid transparent;
    }

    .result-item:hover {
      transform: translateX(5px);
      border-color: #667eea;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
      flex: 1;
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 20px;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-details {
      flex: 1;
    }

    .username {
      font-weight: 600;
      color: #333;
      font-size: 16px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .username:hover {
      color: #667eea;
    }

    .display-name {
      color: #666;
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 8px;
    }

    .badge-friend {
      background: #d4edda;
      color: #155724;
    }

    .action-btn {
      padding: 8px 20px;
      border-radius: 20px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }

    .btn-add {
      background: #667eea;
      color: white;
    }

    .btn-add:hover {
      background: #5568d3;
      transform: scale(1.05);
    }

    .btn-pending {
      background: #e0e0e0;
      color: #666;
      cursor: not-allowed;
    }

    .btn-friends {
      background: #d4edda;
      color: #155724;
      cursor: not-allowed;
    }

    .btn-accept {
      background: #28a745;
      color: white;
    }

    .btn-accept:hover {
      background: #218838;
      transform: scale(1.05);
    }

    .error {
      background: #f8d7da;
      color: #721c24;
      padding: 12px 16px;
      border-radius: 10px;
      margin-top: 20px;
      border-left: 4px solid #f5c6cb;
    }

    .success {
      background: #d4edda;
      color: #155724;
      padding: 12px 16px;
      border-radius: 10px;
      margin-top: 20px;
      border-left: 4px solid #c3e6cb;
    }

    .info {
      background: #d1ecf1;
      color: #0c5460;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      border-left: 4px solid #bee5eb;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 16px;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      padding: 15px;
      background: #f0f4ff;
      border-radius: 10px;
    }

    .stat-item {
      flex: 1;
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #667eea;
    }

    .stat-label {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Test de Búsqueda de Usuarios</h1>
    <p class="subtitle">US1.10 - Task 2 & 3 Testing Interface</p>

    <div class="info">
      <strong>📝 Instrucciones:</strong><br>
      1. Ingresa tu User ID (obtenerlo de Supabase)<br>
      2. Escribe un username para buscar<br>
      3. Prueba enviar solicitudes de amistad
    </div>

    <div class="input-group">
      <label for="userId">🆔 Tu User ID:</label>
      <input 
        type="text" 
        id="userId" 
        placeholder="Ej: 123e4567-e89b-12d3-a456-426614174000"
        value=""
      >
    </div>

    <div class="input-group">
      <label for="searchQuery">🔎 Buscar usuarios:</label>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="searchQuery" 
          placeholder="Escribe un username..."
        >
      </div>
    </div>

    <button onclick="searchUsers()">Buscar</button>

    <div id="message"></div>

    <div class="results" id="results"></div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000';
    let searchResults = [];

    // Auto-buscar mientras escribes (debounce)
    let searchTimeout;
    document.getElementById('searchQuery').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const query = e.target.value.trim();
      
      if (query.length >= 1) {
        searchTimeout = setTimeout(() => {
          searchUsers();
        }, 300);
      } else {
        document.getElementById('results').innerHTML = '';
      }
    });

    async function searchUsers() {
      const userId = document.getElementById('userId').value.trim();
      const query = document.getElementById('searchQuery').value.trim();
      const resultsDiv = document.getElementById('results');
      const messageDiv = document.getElementById('message');

      // Limpiar mensajes previos
      messageDiv.innerHTML = '';

      // Validaciones
      if (!userId) {
        showMessage('Por favor ingresa tu User ID', 'error');
        return;
      }

      if (!query) {
        resultsDiv.innerHTML = '';
        return;
      }

      // Loading
      resultsDiv.innerHTML = '<div class="loading">Buscando usuarios...</div>';

      try {
        const response = await fetch(`${API_BASE}/api/search/users?q=${encodeURIComponent(query)}&userId=${userId}`);
        
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Error en la búsqueda');
        }

        const data = await response.json();
        searchResults = data.users || [];

        displayResults(searchResults);
        showStats(searchResults);

      } catch (error) {
        console.error('Error:', error);
        showMessage(`Error: ${error.message}`, 'error');
        resultsDiv.innerHTML = '';
      }
    }

    function displayResults(users) {
      const resultsDiv = document.getElementById('results');

      if (users.length === 0) {
        resultsDiv.innerHTML = '<div class="empty">No se encontraron usuarios 😔</div>';
        return;
      }

      const html = users.map(user => {
        const avatarContent = user.avatarUrl 
          ? `<img src="${user.avatarUrl}" alt="${user.username}">`
          : user.username.charAt(0).toUpperCase();

        const statusBadge = user.isFriend 
          ? '<span class="badge badge-friend">👥 Amigo</span>' 
          : '';

        const buttonHtml = getActionButton(user);

        return `
          <div class="result-item">
            <div class="user-info">
              <div class="avatar">${avatarContent}</div>
              <div class="user-details">
                <div>
                  <span class="username" onclick="alert('Perfil: ${user.username}')">${user.username}</span>
                  ${statusBadge}
                </div>
                <div class="display-name">${user.displayName || 'Sin nombre'}</div>
              </div>
            </div>
            ${buttonHtml}
          </div>
        `;
      }).join('');

      resultsDiv.innerHTML = html;
    }

    function getActionButton(user) {
      const userId = document.getElementById('userId').value.trim();

      switch (user.friendshipStatus) {
        case 'none':
          return `<button class="action-btn btn-add" onclick="sendFriendRequest('${user.id}', '${user.username}')">➕ Conectar</button>`;
        
        case 'pending_sent':
          return `<button class="action-btn btn-pending" disabled>⏳ Pendiente</button>`;
        
        case 'pending_received':
          return `<button class="action-btn btn-accept" onclick="acceptFriendRequest('${user.id}')">✅ Aceptar</button>`;
        
        case 'friends':
          return `<button class="action-btn btn-friends" disabled>✓ Amigos</button>`;
        
        default:
          return '';
      }
    }

    async function sendFriendRequest(friendId, username) {
      const userId = document.getElementById('userId').value.trim();

      if (!confirm(`¿Enviar solicitud de amistad a ${username}?`)) {
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/add-friend`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: userId,
            friend_id: friendId
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Error enviando solicitud');
        }

        showMessage(`✅ Solicitud enviada a ${username}`, 'success');
        
        // Actualizar resultados
        await searchUsers();

      } catch (error) {
        console.error('Error:', error);
        showMessage(`❌ ${error.message}`, 'error');
      }
    }

    async function acceptFriendRequest(requesterId) {
      alert('Función de aceptar solicitud - Requiere friendship_id de la notificación');
      // Esta función requeriría obtener el friendship_id desde las notificaciones
      // Para una prueba completa, necesitarías integrar con /api/notifications
    }

    function showMessage(text, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.innerHTML = `<div class="${type}">${text}</div>`;
      
      setTimeout(() => {
        messageDiv.innerHTML = '';
      }, 5000);
    }

    function showStats(users) {
      const friends = users.filter(u => u.isFriend).length;
      const strangers = users.length - friends;
      
      console.log(`📊 Estadísticas de búsqueda:
      - Total: ${users.length} usuarios
      - Amigos: ${friends}
      - Desconocidos: ${strangers}
      - Orden alfabético: ${users.map(u => u.username).join(', ')}`);
    }

    // Auto-focus en el primer input
    window.onload = () => {
      document.getElementById('userId').focus();
    };
  </script>
</body>
</html>

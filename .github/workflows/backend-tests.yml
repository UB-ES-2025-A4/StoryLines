name: Backend Tests

on:
  pull_request:
    branches: [ dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: backend
        run: npm install

      - name: Run backend tests (ESM compatible)
        working-directory: backend
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
        run: npm test

name: CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:

jobs:

  # -----------------------
  # BACKEND TESTS (PYTHON)
  # -----------------------
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "18"

    - name: Install backend dependencies
      run: npm install

    - name: Run backend tests
      run: npm test


  # -----------------------
  # FRONTEND TESTS (VUE)
  # -----------------------
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "18"

    - name: Install frontend dependencies
      run: npm install

    - name: Run frontend tests
      run: npm test
